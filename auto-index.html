<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOANGOL – Főmenü</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Arial, sans-serif;
      min-height:100vh;
      background: linear-gradient(135deg,#667eea,#764ba2);
      padding: 28px 18px;
      color:#1f2a44;
      display:flex;
      justify-content:center;
    }
    .wrap{width:min(980px,100%)}
    header{text-align:center;color:#fff;margin-bottom:14px}
    header h1{margin:0 0 6px;font-size:clamp(26px,3.2vw,38px);letter-spacing:.2px}
    header p{margin:0;opacity:.92;font-weight:700}

    .topbar{
      display:flex;flex-wrap:wrap;gap:10px;
      justify-content:center;align-items:center;
      margin: 14px 0 18px;
    }
    .search{
      width:min(520px,100%);
      display:flex;align-items:center;gap:8px;
      background: rgba(255,255,255,.92);
      border-radius:14px;
      padding:10px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.16);
    }
    .search input{
      width:100%;
      border:none;outline:none;
      background:transparent;
      font-size:14px;
    }
    .chipbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .chip{
      border:none;cursor:pointer;
      padding:9px 12px;border-radius:999px;
      background: rgba(255,255,255,.92);
      font-weight:800;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .chip:hover{transform: translateY(-1px); box-shadow: 0 10px 28px rgba(0,0,0,.18)}
    .chip.active{outline: 2px solid rgba(255,255,255,.85)}

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(260px,1fr));
      gap: 16px;
    }

    .cat{
      background: rgba(255,255,255,.94);
      border-radius: 18px;
      padding: 14px 14px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      border-top: 5px solid rgba(0,0,0,.08);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .cat:hover{transform: translateY(-3px); box-shadow: 0 14px 36px rgba(0,0,0,.22)}
    .catHeader{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      margin-bottom:10px;
    }
    .catTitle{
      display:flex;align-items:center;gap:10px;
      font-weight:900;
    }
    .icon{
      width:28px;height:28px;border-radius:10px;
      display:grid;place-items:center;
      color:#fff;font-weight:900;
    }
    .badgeNew{
      font-size:12px;
      font-weight:900;
      padding:4px 8px;
      border-radius:999px;
      background:#ffdc5e;
      color:#1b1b1b;
    }

    .lessonList{display:flex;flex-direction:column;gap:10px}
    .lesson{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      background:#f3f6ff;
      border-radius:14px;
      padding:10px 12px;
      border: 1px solid rgba(0,0,0,.06);
      transition: transform .15s ease;
    }
    .lesson:hover{transform: translateY(-1px)}
    .lesson a{
      text-decoration:none;color:#1f2a44;font-weight:900;
      display:block;flex:1;
    }
    .pill{
      font-size:12px;
      background: rgba(0,0,0,.06);
      padding:6px 10px;border-radius:999px;
      font-weight:800;
    }

    .footerTip{
      text-align:center;
      color: rgba(255,255,255,.9);
      margin-top: 18px;
      font-weight:800;
      font-size: 13px;
    }

    @media (max-width:520px){
      .lesson{align-items:flex-start;flex-direction:column}
      .pill{align-self:flex-start}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📚 GOANGOL – Főmenü</h1>
      <p>Válassz leckét (Flashcards)</p>
    </header>

    <div class="topbar">
      <div class="search" title="Keresés címben és fájlnévben">
        🔎 <input id="q" type="text" placeholder="Keresés… (pl. phrasal, present, kifejezések)" />
      </div>
      <div class="chipbar">
        <button class="chip active" data-sort="az">ABC</button>
        <button class="chip" data-sort="new">Újak elöl</button>
      </div>
    </div>

    <div id="grid" class="grid"></div>

    <div class="footerTip">
      Tipp: ha új leckét teszel a flashcards mappába és commitolsz, a főmenü automatikusan frissül.
    </div>
  </div>

  <script>
    // --- Kategória felismerés + ikon + szín ---
    function detectCategory(name){
      const n = name.toLowerCase();
      if(n.includes("phrasal")) return {key:"phrasal", title:"Phrasal Verbs", icon:"⚡", color:"#ff7a00"};
      if(n.includes("expression") || n.includes("kifejezes")) return {key:"expressions", title:"Expressions / Kifejezések", icon:"🧩", color:"#2dd4bf"};
      if(n.includes("present") || n.includes("nyelvtan") || n.includes("megszam") ) return {key:"grammar", title:"Nyelvtan", icon:"📘", color:"#60a5fa"};
      if(n.includes("szitu")) return {key:"situations", title:"Szituációk", icon:"🛒", color:"#f472b6"};
      return {key:"other", title:"Egyéb", icon:"📌", color:"#a78bfa"};
    }

    // "ÚJ" szabály: ha a fájlnévben van "uj" / "new" vagy a legutóbbi 3 elem között van (egyszerű, stabil)
    function isNew(name, index, total){
      const n = name.toLowerCase();
      if(n.includes("_uj") || n.includes("uj_") || n.includes("new")) return true;
      // utolsó 3 elem "új"
      return index >= Math.max(0, total - 3);
    }

    // YAML generálja ide az adatokat:
    const LESSONS = [];
  </script>
<script>
LESSONS.push(...[
  { file: "flashcards/expressions_19_flashcards.html", name: "expressions 19 flashcards", raw: "expressions_19_flashcards.html", idx: 0, total: 9 },
  { file: "flashcards/expressions_alapfok_18_flashcards.html", name: "expressions alapfok 18 flashcards", raw: "expressions_alapfok_18_flashcards.html", idx: 1, total: 9 },
  { file: "flashcards/golife_elektromos_kutyu_flashcards.html", name: "golife elektromos kutyu flashcards", raw: "golife_elektromos_kutyu_flashcards.html", idx: 2, total: 9 },
  { file: "flashcards/kifejezesek_alapfok_20_flashcards.html", name: "kifejezesek alapfok 20 flashcards", raw: "kifejezesek_alapfok_20_flashcards.html", idx: 3, total: 9 },
  { file: "flashcards/megszamlalhato_megszamlalhatatlan_alapfok.html", name: "megszamlalhato megszamlalhatatlan alapfok", raw: "megszamlalhato_megszamlalhatatlan_alapfok.html", idx: 4, total: 9 },
  { file: "flashcards/phrasal_verbs_alapfok_15_flashcards.html", name: "phrasal verbs alapfok 15 flashcards", raw: "phrasal_verbs_alapfok_15_flashcards.html", idx: 5, total: 9 },
  { file: "flashcards/phrasal_verbs_alapfok_16_flashcards.html", name: "phrasal verbs alapfok 16 flashcards", raw: "phrasal_verbs_alapfok_16_flashcards.html", idx: 6, total: 9 },
  { file: "flashcards/phrasal_verbs_flashcards.html", name: "phrasal verbs flashcards", raw: "phrasal_verbs_flashcards.html", idx: 7, total: 9 },
  { file: "flashcards/present_perfect_flashcards.html", name: "present perfect flashcards", raw: "present_perfect_flashcards.html", idx: 8, total: 9 },
]);
</script>
<script>
  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  const chips = document.querySelectorAll(".chip");

  let sortMode = "az";

  function norm(s){
    return (s||"")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  function render(){
    const query = norm(q.value.trim());

    let items = LESSONS.slice();

    // szűrés
    if(query){
      items = items.filter(x => norm(x.name).includes(query) || norm(x.raw).includes(query));
    }

    // alap rendezés
    items.sort((a,b) => norm(a.name).localeCompare(norm(b.name), "hu"));

    // Újak elöl (a végéről hoz előre)
    if(sortMode === "new"){
      items.sort((a,b) => (isNew(b.raw,b.idx,b.total) - isNew(a.raw,a.idx,a.total)) || norm(a.name).localeCompare(norm(b.name), "hu"));
    }

    // kategóriákba csoport
    const groups = new Map();
    for(const it of items){
      const cat = detectCategory(it.raw);
      if(!groups.has(cat.key)) groups.set(cat.key, { ...cat, lessons: [] });
      groups.get(cat.key).lessons.push(it);
    }

    // kategória sorrend
    const order = ["phrasal","expressions","grammar","situations","other"];
    const cats = Array.from(groups.values()).sort((a,b)=> order.indexOf(a.key) - order.indexOf(b.key));

    grid.innerHTML = "";
    for(const cat of cats){
      const newCount = cat.lessons.filter((x)=>isNew(x.raw,x.idx,x.total)).length;

      const card = document.createElement("div");
      card.className = "cat";
      card.style.borderTopColor = cat.color;

      const header = document.createElement("div");
      header.className = "catHeader";

      const left = document.createElement("div");
      left.className = "catTitle";

      const ic = document.createElement("div");
      ic.className = "icon";
      ic.style.background = cat.color;
      ic.textContent = cat.icon;

      const ttl = document.createElement("div");
      ttl.textContent = cat.title;

      left.appendChild(ic);
      left.appendChild(ttl);

      header.appendChild(left);

      if(newCount > 0){
        const b = document.createElement("div");
        b.className = "badgeNew";
        b.textContent = `ÚJ ${newCount}`;
        header.appendChild(b);
      }

      const list = document.createElement("div");
      list.className = "lessonList";

      for(const l of cat.lessons){
        const row = document.createElement("div");
        row.className = "lesson";

        const a = document.createElement("a");
        a.href = l.file;
        a.textContent = l.name;

        const pill = document.createElement("div");
        pill.className = "pill";
        pill.textContent = "Flashcards";

        row.appendChild(a);
        row.appendChild(pill);
        list.appendChild(row);
      }

      card.appendChild(header);
      card.appendChild(list);
      grid.appendChild(card);
    }
  }

  chips.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      chips.forEach(x=>x.classList.remove("active"));
      btn.classList.add("active");
      sortMode = btn.dataset.sort;
      render();
    });
  });

  q.addEventListener("input", render);
  render();
</script>

</body>
</html>
