<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GOANGOL – Főmenü</title>

  <style>
    :root{
      --bg1:#6a6fe6;
      --bg2:#6b55c8;
      --text:#172554;
      --sub:#3b4a7a;
      --shadow: 0 14px 40px rgba(0,0,0,.18);
      --shadow2: 0 10px 26px rgba(0,0,0,.16);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 700px at 20% 0%, #7d83ff 0%, transparent 55%),
                  radial-gradient(900px 600px at 95% 10%, #8b6cff 0%, transparent 50%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height:100vh;
    }
    header{
      padding: 34px 16px 18px;
      text-align:center;
      color:#fff;
    }
    .title{
      display:flex; gap:10px; justify-content:center; align-items:center;
      font-weight:800; font-size: 34px; letter-spacing:.2px;
      margin:0;
    }
    .subtitle{
      margin:8px 0 0;
      opacity:.92;
      font-weight:600;
    }
    .wrap{
      max-width: 1120px;
      margin: 0 auto;
      padding: 10px 14px 36px;
    }

    /* Toolbar */
    .toolbar{
      display:grid;
      grid-template-columns: 1fr 240px;
      gap:12px;
      margin: 12px auto 18px;
      max-width: 980px;
    }
    @media (max-width: 720px){
      .toolbar{ grid-template-columns: 1fr; }
    }
    .input, .select{
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.14);
      color:#fff;
      padding: 12px 14px;
      border-radius: 14px;
      outline:none;
      box-shadow: 0 8px 22px rgba(0,0,0,.10);
      backdrop-filter: blur(6px);
    }
    .input::placeholder{ color: rgba(255,255,255,.78); }
    .select option{ color:#111; }

    /* Grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items:start;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px){
      .grid{ grid-template-columns: 1fr; }
    }

    /* Category cards */
    .category{
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      overflow:hidden;
      backdrop-filter: blur(6px);
    }
    .cat-head{
      display:flex;
      gap:12px;
      align-items:center;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.18);
    }
    .cat-icon{
      width: 40px; height: 40px;
      border-radius: 14px;
      display:grid; place-items:center;
      color:#fff;
      font-size: 20px;
      flex: 0 0 auto;
      box-shadow: 0 10px 18px rgba(0,0,0,.18);
      background: var(--catColor, #3b82f6);
    }
    .cat-title{
      font-weight:800;
      color:#fff;
      margin:0;
      line-height:1.1;
    }
    .cat-note{
      margin:3px 0 0;
      font-size: 13px;
      color: rgba(255,255,255,.88);
      font-weight:600;
    }
    .lessons{
      padding: 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    /* Lesson cards (hover anim) */
    a.lesson{
      text-decoration:none;
      color: inherit;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(23,37,84,.06);
      border-radius: 14px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      position:relative;
      transform: translateY(0) scale(1);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,.10);
    }
    a.lesson:hover{
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 14px 26px rgba(0,0,0,.16);
      border-color: rgba(23,37,84,.12);
    }
    a.lesson:active{
      transform: translateY(-1px) scale(1.005);
    }

    .lesson-left{ min-width:0; }
    .lesson-title{
      margin:0;
      font-weight:800;
      color: var(--text);
      font-size: 14.5px;
      text-transform: none;
    }
    .lesson-sub{
      margin:3px 0 0;
      color: var(--sub);
      font-weight:700;
      font-size: 12.5px;
      opacity:.92;
    }

    .pill{
      font-weight:800;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(59,130,246,.12);
      color: #1d4ed8;
      border: 1px solid rgba(59,130,246,.20);
      flex: 0 0 auto;
      white-space:nowrap;
    }

    /* NEW badge */
    .badge-new{
      position:absolute;
      top: -9px;
      left: 10px;
      background: #ff3d71;
      color:#fff;
      font-weight:900;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      box-shadow: 0 10px 18px rgba(0,0,0,.18);
      letter-spacing:.2px;
    }

    .empty{
      margin: 14px auto 0;
      text-align:center;
      color: rgba(255,255,255,.92);
      font-weight:800;
      display:none;
    }

    footer{
      text-align:center;
      color: rgba(255,255,255,.92);
      font-weight:700;
      padding: 8px 10px 28px;
      font-size: 13px;
    }
    .tip{
      opacity:.92;
      max-width: 920px;
      margin: 0 auto;
      line-height:1.4;
    }
  </style>
</head>

<body>
  <header>
    <h1 class="title">🧠 GOANGOL – Főmenü</h1>
    <p class="subtitle">Válassz leckét (Flashcards)</p>

    <div class="wrap">
      <div class="toolbar">
        <input id="search" class="input" type="search" placeholder="Keresés: pl. present perfect, alapfok 16..." />
        <select id="sort" class="select">
          <option value="name-asc">Rendezés: ABC (A→Z)</option>
          <option value="name-desc">Rendezés: ABC (Z→A)</option>
          <option value="date-desc">Rendezés: Dátum (új→régi)</option>
          <option value="date-asc">Rendezés: Dátum (régi→új)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty">Nincs találat a keresésre.</div>
  </main>

  <footer>
    <div class="tip">
      Tipp: ha új leckét teszel fel a <b>flashcards</b> mappába és commitolsz, a főmenü automatikusan frissül.
    </div>
  </footer>

  <script>
    // Ikon + szín kategóriánként
    const CATEGORIES = {
      phrasal:    { title: "Phrasal Verbs",             icon: "⚡", color: "#3b82f6", note: "" },
      expr:       { title: "Expressions / Kifejezések", icon: "🧩", color: "#22c55e", note: "" },
      grammar:    { title: "Nyelvtan",                  icon: "📘", color: "#a855f7", note: "" },
      situations: { title: "Szituációk",                icon: "🛒", color: "#f59e0b", note: "" },
    };

    // Frissnek számítson-e automatikusan (napokban)
    const NEW_DAYS = 14;

    // Leckék listája (bővíthető)
    // date: "YYYY-MM-DD"
    // isNew: true -> kézi "ÚJ"
    const LESSONS = [
      // Phrasal
      { cat:"phrasal",  title:"Phrasal Verbs Alapfok 15", sub:"Flashcards", href:"flashcards/phrasal_verbs_15.html", date:"2025-12-12", isNew:false },
      { cat:"phrasal",  title:"Phrasal Verbs Alapfok 16", sub:"Flashcards", href:"flashcards/phrasal_verbs_16.html", date:"2025-12-12", isNew:false },
      { cat:"phrasal",  title:"Phrasal Verbs",            sub:"Flashcards", href:"flashcards/phrasal_verbs.html",    date:"2025-12-10", isNew:false },

      // Expressions
      { cat:"expr", title:"Expressions 19",         sub:"Flashcards", href:"flashcards/expressions_19.html", date:"2025-12-05", isNew:false },
      { cat:"expr", title:"Expressions Alapfok 18", sub:"Flashcards", href:"flashcards/expressions_18.html", date:"2025-12-05", isNew:false },
      { cat:"expr", title:"Kifejezések Alapfok 20", sub:"Flashcards", href:"flashcards/kifejezesek_20.html", date:"2026-01-02", isNew:true },

      // Grammar
      { cat:"grammar", title:"Megszámlálható / Megszámlálhatatlan", sub:"Alapfok • Flashcards", href:"grammar/countable_uncountable.html", date:"2025-12-11", isNew:false },
      { cat:"grammar", title:"Present Perfect", sub:"Flashcards", href:"grammar/present_perfect_flashcards.html", date:"2025-12-05", isNew:false },

      // Situations
      { cat:"situations", title:"Golife Elektromos Kutyú", sub:"Flashcards", href:"situaciok/golife_flashcards.html", date:"2025-12-12", isNew:false },
    ];

    function isNewLesson(lesson){
      if (lesson.isNew) return true;
      if (!lesson.date) return false;
      const d = new Date(lesson.date + "T00:00:00");
      const now = new Date();
      const diffDays = (now - d) / (1000*60*60*24);
      return diffDays >= 0 && diffDays <= NEW_DAYS;
    }

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const search = document.getElementById("search");
    const sortSel = document.getElementById("sort");

    function normalize(s){ return (s||"").toLowerCase().trim(); }

    function sortLessons(list, mode){
      const copy = [...list];
      const byName = (a,b) => normalize(a.title).localeCompare(normalize(b.title), "hu");
      const byDate = (a,b) => {
        const ad = a.date ? new Date(a.date+"T00:00:00").getTime() : 0;
        const bd = b.date ? new Date(b.date+"T00:00:00").getTime() : 0;
        return ad - bd;
      };
      switch(mode){
        case "name-desc": return copy.sort((a,b)=> byName(b,a));
        case "date-asc":  return copy.sort((a,b)=> byDate(a,b));
        case "date-desc": return copy.sort((a,b)=> byDate(b,a));
        default:          return copy.sort((a,b)=> byName(a,b));
      }
    }

    function render(){
      const q = normalize(search.value);
      const mode = sortSel.value;

      let filtered = LESSONS.filter(l => {
        const hay = normalize([l.title, l.sub, CATEGORIES[l.cat]?.title].join(" "));
        return !q || hay.includes(q);
      });

      filtered = sortLessons(filtered, mode);

      const grouped = {};
      for (const l of filtered){
        (grouped[l.cat] ||= []).push(l);
      }

      grid.innerHTML = "";

      const catsInOrder = Object.keys(CATEGORIES).filter(cat => grouped[cat]?.length);
      for (const catKey of catsInOrder){
        const cat = CATEGORIES[catKey];

        const card = document.createElement("section");
        card.className = "category";
        card.style.setProperty("--catColor", cat.color);

        const head = document.createElement("div");
        head.className = "cat-head";

        const icon = document.createElement("div");
        icon.className = "cat-icon";
        icon.textContent = cat.icon;

        const titles = document.createElement("div");
        const h = document.createElement("h2");
        h.className = "cat-title";
        h.textContent = cat.title;

        const note = document.createElement("div");
        note.className = "cat-note";
        note.textContent = cat.note || "";

        titles.appendChild(h);
        titles.appendChild(note);

        head.appendChild(icon);
        head.appendChild(titles);

        const lessonsWrap = document.createElement("div");
        lessonsWrap.className = "lessons";

        for (const l of grouped[catKey]){
          const a = document.createElement("a");
          a.className = "lesson";
          a.href = l.href;

          const left = document.createElement("div");
          left.className = "lesson-left";

          const t = document.createElement("p");
          t.className = "lesson-title";
          t.textContent = l.title;

          const s = document.createElement("p");
          s.className = "lesson-sub";
          s.textContent = l.sub || "Flashcards";

          left.appendChild(t);
          left.appendChild(s);

          const pill = document.createElement("div");
          pill.className = "pill";
          pill.textContent = "Flashcards";

          if (isNewLesson(l)){
            const b = document.createElement("div");
            b.className = "badge-new";
            b.textContent = "ÚJ";
            a.appendChild(b);
          }

          a.appendChild(left);
          a.appendChild(pill);
          lessonsWrap.appendChild(a);
        }

        card.appendChild(head);
        card.appendChild(lessonsWrap);
        grid.appendChild(card);
      }

      empty.style.display = (filtered.length === 0) ? "block" : "none";
    }

    search.addEventListener("input", render);
    sortSel.addEventListener("change", render);
    render();
  </script>
</body>
</html>
