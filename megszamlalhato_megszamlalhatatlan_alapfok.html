<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megszámlálható / megszámlálhatatlan – Gyakorló</title>
    <style>

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #ffffff;
    color: #667eea;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    z-index: 9999;
}
.back-button:hover { background: #f0f0f0; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }

        .hungarian {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .note {
            margin-top: -10px;
            margin-bottom: 18px;
            padding: 12px 14px;
            background: #eef2ff;
            border: 2px solid #667eea;
            border-radius: 12px;
            color: #2b2f7a;
            font-size: 14px;
            display: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .check-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .next-btn {
            background: #28a745;
            color: white;
            display: none;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .correct-answer {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            font-weight: 500;
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #666;
        }

        .completion {
            text-align: center;
            display: none;
        }

        .completion h2 {
            color: #28a745;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 40px;
            margin-top: 20px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .voice-btn {
            background: #dc3545;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .voice-btn.listening {
            background: #28a745;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .voice-result {
            margin-top: 15px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
            border: 2px solid #2196f3;
            display: none;
        }

        .voice-result strong {
            color: #1976d2;
        }

        .audio-playback {
            margin-top: 15px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            border: 2px solid #667eea;
            display: none;
        }

        .audio-playback audio {
            width: 100%;
            margin-top: 10px;
        }

        .playback-label {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<a class="back-button" href="../index.html">← Vissza a főmenübe</a>

    <div class="container">
        <h1>📚 Megszámlálható / megszámlálhatatlan – alapfok</h1>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('write')">✍️ Írás mód</button>
            <button class="mode-btn" onclick="setMode('speak')">🎤 Beszéd mód</button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="cardContainer">
            <div class="card">
                <div class="hungarian" id="hungarianText"></div>
                <div class="note" id="noteBox"></div>

                <input type="text" id="answerInput" placeholder="Írd be az angol mondatot..." autocomplete="off">
                <div class="buttons" id="writeButtons">
                    <button class="check-btn" onclick="checkAnswer()">Ellenőrzés</button>
                    <button class="next-btn" id="nextBtn" onclick="nextCard()">Következő →</button>
                </div>

                <div class="buttons" id="voiceButtons" style="display: none;">
                    <button class="voice-btn" id="voiceBtn" onclick="startListening()">
                        <span id="micIcon">🎤</span>
                        <span id="voiceText">Nyomd meg és beszélj</span>
                    </button>
                    <button class="next-btn" id="nextBtnVoice" onclick="nextCard()" style="display: none;">Következő →</button>
                </div>

                <div class="voice-result" id="voiceResult"></div>
                <div class="audio-playback" id="audioPlayback">
                    <div class="playback-label">🔊 Hallgasd vissza a kiejtésed:</div>
                    <audio id="audioPlayer" controls></audio>
                </div>

                <div class="result" id="result"></div>

                <div class="voice-result" id="processingMsg" style="display: none; background: #fff3cd; border-color: #ffc107;">
                    <strong>⏳ Feldolgozás...</strong> Értékelem a válaszod...
                </div>
            </div>

            <div class="stats" id="stats">Mondat <span id="current">1</span> / <span id="total">0</span></div>
        </div>

        <div class="completion" id="completion">
            <h2>🎉 Gratulálok!</h2>
            <div class="score" id="finalScore"></div>
            <p style="font-size: 18px; color: #666; margin-bottom: 20px;">Helyes válaszok aránya</p>
            <button class="restart-btn" onclick="restart()">Újrakezdés</button>
        </div>
    </div>

    <script>
        const sentences = [

            },

            },

            },

            },

            },

            },

            },

                english: "How many players are there in the team?"
            },
            {
                hungarian: "Sok felszerelés kell ehhez a sporthoz.",
                english: "You need a lot of equipment to do this sport."
            },
            {
                hungarian: "A főnököm kevés magyarul tud. Alig értem őt. (He)",
                english: "My boss can speak little Hungarian . I can barely understand him."
            },
            {
                hungarian: "Sok alkalmazást használsz a telefonodon?",
                english: "Do you use many applications on your phone?"
            },
            {
                hungarian: "Mennyi benzin van az autóban?",
                english: "How much gas is in the car?"
            },
            {
                hungarian: "Van szállás 200 diáknak.",
                english: "There's accommodation for 200 students."
            },
            {
                hungarian: "Kevés pénz van nálam.",
                english: "I have little money on me."
            },
            {
                hungarian: "Nem kaptunk sok információt a szállodáról.",
                english: "We didn't get much information about the hotel."
            },
            {
                hungarian: "Mindig túl sok parfümöt használ. (She)",
                english: "She always wears too much perfume ."
            },
            {
                hungarian: "Van egy kis hírünk számodra.",
                english: "We have some news for you."
            },
            {
                hungarian: "Mennünk kell vásárolni. Kevés kenyér van otthon.",

            },
            {

                english: "She always drinks little water during the day. She should drink more."
            },
            {

                english: "We took a lot of luggage on our honeymoon."
            },
            {

            },

            },

                english: "She has few friends . Nobody likes her."
            },

                english: "My brother has little patience . He hates waiting."
            },
            {

                english: "There is not much news about the victims of the earthquake."
            },
            {

                english: "Few people have seen the play."
            },

                english: "There was little traffic this morning."
            },

                english: "How many photos did you take at the wedding?"
            },

                english: "How much blood did you lose in the accident?"
            },
            {

                english: "There is little sugar at home."
            },
            {

                english: "Are there a lot of people outside?"
            },
            {
                hungarian: "Kevés park van ebben a városban.",
                english: "There are few parks in this city."
            },
            {
                hungarian: "Mennyi vizet szeretnél?",
                english: "How much water do you want?"
            }
        ];

        // Rövid megjegyzések pár "csapdás" szóra
        const notes = [
            {
                contains: "a piece of furniture",
                text: "💡 Tipp: furniture = megszámlálhatatlan. Ezért mondjuk: a piece of furniture / two pieces of furniture."
            },
            {
                contains: "some news",
                text: "💡 Tipp: news = megszámlálhatatlan (nem: a news). Pl.: some news / a piece of news."
            },
            {
                contains: "accommodation",
                text: "💡 Tipp: accommodation gyakran megszámlálhatatlan. (Nem: many accommodations – inkább: a lot of accommodation / places to stay.)"
            },
            {
                contains: "luggage",
                text: "💡 Tipp: luggage = megszámlálhatatlan. Pl.: a lot of luggage / two bags."
            }
        ];

        let currentIndex = 0;
        let correctCount = 0;
        let currentMode = 'write';
        let recognition = null;
        let isListening = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordedAudioURL = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('voiceResult').style.display = 'block';
                document.getElementById('voiceResult').innerHTML = `<strong>Amit mondtál:</strong> "${transcript}"`;

                document.getElementById('processingMsg').style.display = 'block';

                setTimeout(() => {
                    document.getElementById('processingMsg').style.display = 'none';
                    checkVoiceAnswer(transcript);
                }, 1200);
            };

            recognition.onerror = function(event) {
                console.error('Hangfelismerési hiba:', event.error);
                document.getElementById('voiceResult').style.display = 'block';
                document.getElementById('voiceResult').innerHTML = `<strong>Hiba:</strong> Nem sikerült felismerni. Próbáld újra!`;
                stopListening();
            };

            recognition.onend = function() {
                stopListening();
            };
        }

        function setMode(mode) {
            currentMode = mode;

            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'write') {
                document.getElementById('answerInput').style.display = 'block';
                document.getElementById('writeButtons').style.display = 'flex';
                document.getElementById('voiceButtons').style.display = 'none';
            } else {
                document.getElementById('answerInput').style.display = 'none';
                document.getElementById('writeButtons').style.display = 'none';
                document.getElementById('voiceButtons').style.display = 'flex';
            }

            document.getElementById('result').style.display = 'none';
            document.getElementById('voiceResult').style.display = 'none';
            document.getElementById('audioPlayback').style.display = 'none';
            document.getElementById('processingMsg').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('nextBtnVoice').style.display = 'none';
        }

        function startListening() {
            if (!recognition) {
                alert('Sajnálom, a böngésződ nem támogatja a hangfelismerést. Próbáld meg Chrome böngészőben!');
                return;
            }

            if (isListening) {
                recognition.stop();
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        recordedAudioURL = URL.createObjectURL(audioBlob);
                        document.getElementById('audioPlayer').src = recordedAudioURL;
                        document.getElementById('audioPlayback').style.display = 'block';
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();

                    isListening = true;
                    document.getElementById('voiceBtn').classList.add('listening');
                    document.getElementById('voiceText').textContent = 'Hallgatlak...';
                    document.getElementById('micIcon').textContent = '🔴';
                    document.getElementById('voiceResult').style.display = 'none';
                    document.getElementById('audioPlayback').style.display = 'none';

                    recognition.start();
                })
                .catch(error => {
                    console.error('Mikrofon hozzáférési hiba:', error);
                    alert('Nem sikerült hozzáférni a mikrofonhoz. Engedélyezd a mikrofon használatát!');
                });
        }

        function stopListening() {
            isListening = false;
            document.getElementById('voiceBtn').classList.remove('listening');
            document.getElementById('voiceText').textContent = 'Nyomd meg és beszélj';
            document.getElementById('micIcon').textContent = '🎤';

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        }

        function checkVoiceAnswer(transcript) {
            const correctAnswer = sentences[currentIndex].english;
            const acceptableAnswers = Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer];
            const resultDiv = document.getElementById('result');

            const userNorm = normalize(transcript);
            const correctNorms = acceptableAnswers.map(a => normalize(a));

            resultDiv.style.display = 'block';
            document.getElementById('nextBtnVoice').style.display = 'block';

            if (correctNorms.includes(userNorm)) {
                correctCount++;
                resultDiv.className = 'result correct';
                resultDiv.innerHTML = '<strong>✓ Helyes!</strong><div class="correct-answer">Remek kiejtés! 🎉</div>';
            } else {
                resultDiv.className = 'result incorrect';
                resultDiv.innerHTML = `
                    <strong>✗ Nem egészen...</strong>
                    <div class="correct-answer">
                        <strong>A helyes mondat:</strong><br>
                        ${acceptableAnswers[0]}
                        ${acceptableAnswers.length>1 ? `<div style=\"margin-top:10px\"><strong>Más elfogadott válaszok:</strong><br>${acceptableAnswers.slice(1).join('<br>')}</div>` : ''}
                    </div>
                `;
            }
        }

        function normalize(str) {
            return (str || "")
                .toLowerCase()
                // normalize tricky whitespace (e.g., non-breaking spaces from copy/paste)
                .replace(/\u00A0/g, " ")
                // unify apostrophes
                .replace(/[’]/g, "'")
                // expand common contractions so "he is" == "he's"
                .replace(/\bthere's\b/g, "there is")
                .replace(/\bthat's\b/g, "that is")
                .replace(/\bwhat's\b/g, "what is")
                .replace(/\bi'm\b/g, "i am")
                .replace(/\byou're\b/g, "you are")
                .replace(/\bhe's\b/g, "he is")
                .replace(/\bshe's\b/g, "she is")
                .replace(/\bit's\b/g, "it is")
                .replace(/\bwe're\b/g, "we are")
                .replace(/\bthey're\b/g, "they are")
                .replace(/\bi've\b/g, "i have")
                .replace(/\byou've\b/g, "you have")
                .replace(/\bwe've\b/g, "we have")
                .replace(/\bthey've\b/g, "they have")
                .replace(/\bcan't\b/g, "cannot")
                .replace(/\bwon't\b/g, "will not")
                .replace(/\bdon't\b/g, "do not")
                .replace(/\bdoesn't\b/g, "does not")
                .replace(/\bdidn't\b/g, "did not")
                .replace(/\bisn't\b/g, "is not")
                .replace(/\baren't\b/g, "are not")
                .replace(/\bwasn't\b/g, "was not")
                .replace(/\bweren't\b/g, "were not")
                .replace(/\bhaven't\b/g, "have not")
                .replace(/\bhasn't\b/g, "has not")
                .replace(/\bhadn't\b/g, "had not")
                // remove spaces before punctuation, then remove punctuation
                .replace(/\s+([.,!?;:])/g, "$1")
                .replace(/[.,!?;:]/g, "")
                // drop remaining apostrophes after expansion
                .replace(/'/g, "")
                // collapse spaces
                .replace(/\s+/g, " ")
                .trim();
        }


        function loadCard() {
            const s = sentences[currentIndex];
            document.getElementById('hungarianText').textContent = s.hungarian;

            // notes
            const noteBox = document.getElementById('noteBox');
            const en = s.english.toLowerCase();
            const note = notes.find(n => en.includes(n.contains));
            if (note) {
                noteBox.textContent = note.text;
                noteBox.style.display = 'block';
            } else {
                noteBox.style.display = 'none';
            }

            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').focus();
            document.getElementById('result').style.display = 'none';
            document.getElementById('voiceResult').style.display = 'none';
            document.getElementById('audioPlayback').style.display = 'none';
            document.getElementById('processingMsg').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('nextBtnVoice').style.display = 'none';
            document.getElementById('current').textContent = currentIndex + 1;
            document.getElementById('total').textContent = sentences.length;

            if (recordedAudioURL) {
                URL.revokeObjectURL(recordedAudioURL);
                recordedAudioURL = null;
            }

            const progress = ((currentIndex) / sentences.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value;
            const correctAnswer = sentences[currentIndex].english;
            const acceptableAnswers = Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer];
            const resultDiv = document.getElementById('result');

            const userNorm = normalize(userAnswer);
            const correctNorms = acceptableAnswers.map(a => normalize(a));

            resultDiv.style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';

            if (correctNorms.includes(userNorm)) {
                correctCount++;
                resultDiv.className = 'result correct';
                resultDiv.innerHTML = '<strong>✓ Helyes!</strong><div class="correct-answer">Kitűnő munka! 🎉</div>';
            } else {
                resultDiv.className = 'result incorrect';
                resultDiv.innerHTML = `
                    <strong>✗ Nem egészen...</strong>
                    <div class="correct-answer">
                        <strong>A helyes mondat:</strong><br>
                        ${acceptableAnswers[0]}
                        ${acceptableAnswers.length>1 ? `<div style=\"margin-top:10px\"><strong>Más elfogadott válaszok:</strong><br>${acceptableAnswers.slice(1).join('<br>')}</div>` : ''}
                    </div>
                `;
            }
        }

        function nextCard() {
            currentIndex++;
            if (currentIndex < sentences.length) {
                loadCard();
            } else {
                showCompletion();
            }
        }

        function showCompletion() {
            document.getElementById('cardContainer').style.display = 'none';
            document.getElementById('completion').style.display = 'block';

            const percentage = Math.round((correctCount / sentences.length) * 100);
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('progressFill').style.width = '100%';
        }

        function restart() {
            currentIndex = 0;
            correctCount = 0;
            document.getElementById('cardContainer').style.display = 'block';
            document.getElementById('completion').style.display = 'none';
            loadCard();
        }

        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('nextBtn').style.display === 'none') {
                    checkAnswer();
                } else {
                    nextCard();
                }
            }
        });

        loadCard();
    </script>
</body>
</html>
