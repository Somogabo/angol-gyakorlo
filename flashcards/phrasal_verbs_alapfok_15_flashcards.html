<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verbs alapfok 15</title>
<style>

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #ffffff;
    color: #667eea;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    z-index: 9999;
}
.back-button:hover { background: #f0f0f0; }

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh; padding:20px;
  display:flex; justify-content:center; align-items:center;
}
.container {
  background:white; border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  max-width:760px; width:100%; padding:34px;
}
h1 { color:#667eea; text-align:center; margin-bottom:10px; font-size:28px; }
.chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:12px; }
.chip {
  display:inline-flex; align-items:center;
  padding:8px 12px; border-radius:999px;
  border:2px solid #e6e8ff; background:#f3f5ff;
  color:#3f51b5; font-weight:600; font-size:14px;
}
.stage { text-align:center; font-weight:700; color:#4b5563; margin:8px 0 14px 0; }
.progress-bar { background:#e0e0e0; height:8px; border-radius:10px; margin-bottom:22px; overflow:hidden; }
.progress-fill { background: linear-gradient(90deg,#667eea,#764ba2); height:100%; width:0%; transition:width .3s ease; }
.card { background:#f8f9fa; border-radius:15px; padding:28px; margin-bottom:20px; border:2px solid #e0e0e0; }
.hungarian { font-size:20px; color:#333; margin-bottom:18px; font-weight:500; }
.subhint { margin-top:-8px; margin-bottom:14px; color:#6b7280; font-size:14px; }
input[type="text"] {
  width:100%; padding:15px; font-size:16px;
  border:2px solid #ddd; border-radius:10px; margin-bottom:15px;
  transition:border-color .3s;
}
input[type="text"]:focus { outline:none; border-color:#667eea; }
.buttons { display:flex; gap:10px; }
button {
  flex:1; padding:15px; font-size:16px;
  border:none; border-radius:10px; cursor:pointer;
  font-weight:600; transition: transform .2s, opacity .2s;
}
button:hover { transform: translateY(-2px); opacity:.9; }
.check-btn { background: linear-gradient(135deg,#667eea,#764ba2); color:white; }
.next-btn { background:#28a745; color:white; display:none; }
.result { margin-top:20px; padding:20px; border-radius:10px; display:none; animation:fadeIn .3s; }
@keyframes fadeIn { from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }
.correct { background:#d4edda; border:2px solid #28a745; color:#155724; }
.incorrect { background:#f8d7da; border:2px solid #dc3545; color:#721c24; }
.correct-answer { margin-top:15px; padding:15px; background:white; border-radius:8px; font-weight:500; }
.stats { text-align:center; margin-top:10px; font-size:18px; color:#666; }
.completion { text-align:center; display:none; }
.completion h2 { color:#28a745; margin-bottom:20px; font-size:32px; }
.score { font-size:48px; font-weight:bold; color:#667eea; margin:20px 0; }
.restart-btn { background: linear-gradient(135deg,#667eea,#764ba2); color:white; padding:15px 40px; margin-top:20px; }
.mode-selector { display:flex; gap:10px; margin:14px 0 18px 0; }
.mode-btn {
  flex:1; padding:12px;
  border:2px solid #667eea; background:white; color:#667eea;
  border-radius:10px; cursor:pointer; font-weight:600; transition: all .3s;
}
.mode-btn.active { background: linear-gradient(135deg,#667eea,#764ba2); color:white; }
.voice-btn {
  background:#dc3545; color:white; display:flex; align-items:center; justify-content:center; gap:10px;
}
.voice-btn.listening { background:#28a745; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.7;} }
.voice-result { margin-top:15px; padding:15px; background:#e3f2fd; border-radius:8px; border:2px solid #2196f3; display:none; }
.audio-playback { margin-top:15px; padding:15px; background:#f0f4ff; border-radius:8px; border:2px solid #667eea; display:none; }
.audio-playback audio { width:100%; margin-top:10px; }
.playback-label { color:#667eea; font-weight:600; margin-bottom:5px; }
</style>
</head>
<body>
<a href="../index.html" class="back-button">← Vissza a főmenübe</a>

<div class="container">
  <h1>📘 Phrasal Verbs alapfok 15</h1>
  <div class="chips"><span class="chip">drop off</span><span class="chip">dry out</span><span class="chip">eat up</span><span class="chip">fall over</span><span class="chip">finish with sy</span><span class="chip">fit in</span></div>
  <div class="stage" id="stageLabel">Bemelegítés: kifejezések</div>

  <div class="mode-selector">
    <button class="mode-btn active" onclick="setMode('write')">✍️ Írás mód</button>
    <button class="mode-btn" onclick="setMode('speak')">🎤 Beszéd mód</button>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div id="cardContainer">
    <div class="card">
      <div class="hungarian" id="hungarianText"></div>
      <div class="subhint" id="subHint"></div>

      <input type="text" id="answerInput" placeholder="Írd be az angol megoldást..." autocomplete="off">
      <div class="buttons" id="writeButtons">
        <button class="check-btn" onclick="checkAnswer()">Ellenőrzés</button>
        <button class="next-btn" id="nextBtn" onclick="nextCard()">Következő →</button>
      </div>

      <div class="buttons" id="voiceButtons" style="display:none;">
        <button class="voice-btn" id="voiceBtn" onclick="startListening()">
          <span id="micIcon">🎤</span><span id="voiceText">Nyomd meg és beszélj</span>
        </button>
        <button class="next-btn" id="nextBtnVoice" onclick="nextCard()" style="display:none;">Következő →</button>
      </div>

      <div class="voice-result" id="voiceResult"></div>
      <div class="audio-playback" id="audioPlayback">
        <div class="playback-label">🔊 Hallgasd vissza a kiejtésed:</div>
        <audio id="audioPlayer" controls></audio>
      </div>

      <div class="result" id="result"></div>

      <div class="voice-result" id="processingMsg" style="display:none; background:#fff3cd; border-color:#ffc107;">
        <strong>⏳ Feldolgozás...</strong> Értékelem a válaszod...
      </div>
    </div>

    <div class="stats">Feladat <span id="current">1</span> / <span id="total">0</span></div>
  </div>

  <div class="completion" id="completion">
    <h2>🎉 Kész!</h2>
    <div class="score" id="finalScore"></div>
    <p style="font-size:18px; color:#666; margin-bottom:20px;">Helyes válaszok aránya</p>
    <button class="restart-btn" onclick="restart()">Újrakezdés</button>
  </div>
</div>

<script>
const items = [
  {
                kind: "phrase",
                hungarian: "elalszik (pl. film közben)",
                english: "drop off"
            },
            {
                kind: "phrase",
                hungarian: "kiszárít / kiszárad",
                english: "dry out"
            },
            {
                kind: "phrase",
                hungarian: "megeszik mind (maradék nélkül)",
                english: "eat up"
            },
            {
                kind: "phrase",
                hungarian: "elesik",
                english: "fall over"
            },
            {
                kind: "phrase",
                hungarian: "szakít vkivel",
                english: "finish with sy"
            },
            {
                kind: "phrase",
                hungarian: "beilleszkedik",
                english: "fit in"
            },
  {
                kind: "sentence",
                hungarian: "Elaludtam a film alatt, és csak a végén ébredtem fel. (He)",
                english: "I dropped off during the film and woke up when it ended."
            },
            {
                kind: "sentence",
                hungarian: "A napon szárítottuk ki a virágokat.",
                english: "We dried out the flowers in the sun."
            },
            {
                kind: "sentence",
                hungarian: "Ha nem eszed meg a levest, nem kapsz desszertet. (He)",
                english: "If you don’t eat up the soup, you won’t get any dessert."
            },
            {
                kind: "sentence",
                hungarian: "Megcsúsztam a jégen és elestem. (He)",
                english: "I slipped on the ice and fell over."
            },
            {
                kind: "sentence",
                hungarian: "Lisa pár hete szakított Liammel. (She)",
                english: "Lisa finished with Liam a few weeks ago."
            },
            {
                kind: "sentence",
                hungarian: "Nem illettem bele a csapatba, ezért másik munkát találtam. (He)",
                english: "I didn’t fit in the team, so I found another job."
            },
            {
                kind: "sentence",
                hungarian: "A múlt héten átestem a gereblyén a kertben és eltörtem a karom. (He)",
                english: "Last week, I fell over the rake in the garden and I broke my arm."
            },
            {
                kind: "sentence",
                hungarian: "Tegnap Julie nem akart főzni, ezért elmentünk étterembe. (She)",
                english: "Yesterday Julie didn’t want to cook, so we went to eat out."
            },
            {
                kind: "sentence",
                hungarian: "Azt hiszem, soha nem fogok beilleszkedni ebbe a közösségbe. Olyan különböző vagyok. (He)",
                english: "I think I will never fit in this community. I’m so different!"
            },
            {
                kind: "sentence",
                hungarian: "Az előadás annyira unalmas volt, hogy szinte azonnal elaludtam. (He)",
                english: "The performance was so boring that I dropped off right after it has started."
            },
            {
                kind: "sentence",
                hungarian: "A napra várunk, hogy kiszárítsa a földet. Nagyon saras minden.",
                english: "We are waiting for the sun to dry the ground out. There’s a lot of mud here."
            },
            {
                kind: "sentence",
                hungarian: "Szakítottam Jimmyvel. Nincs közös jövőnk. (She)",
                english: "I've finished with Jimmy. We have no future together."
            },
            {
                kind: "sentence",
                hungarian: "A torta finom volt. A vendégek mind megették.",
                english: "The cake was delicious. The guests have eaten up all of it."
            },
            {
                kind: "sentence",
                hungarian: "Sheila szakított Robbal, amikor rájött, hogy megcsalta. (She)",
                english: "Sheila finished with Rob when she realized that he had cheated on her."
            }
];

const phraseCount = 6;
const sentenceCount = 14;

let currentIndex = 0;
let correctCount = 0;
let currentMode = 'write';
let recognition = null;
let isListening = false;
let mediaRecorder = null;
let audioChunks = [];
let recordedAudioURL = null;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    document.getElementById('voiceResult').style.display = 'block';
    document.getElementById('voiceResult').innerHTML = '<strong>Amit mondtál:</strong> "' + transcript + '"';

    document.getElementById('processingMsg').style.display = 'block';
    setTimeout(() => {
      document.getElementById('processingMsg').style.display = 'none';
      checkVoiceAnswer(transcript);
    }, 900);
  };

  recognition.onerror = function() {
    document.getElementById('voiceResult').style.display = 'block';
    document.getElementById('voiceResult').innerHTML = '<strong>Hiba:</strong> Nem sikerült felismerni. Próbáld újra!';
    stopListening();
  };

  recognition.onend = function() {
    stopListening();
  };
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  if (mode === 'write') {
    document.getElementById('answerInput').style.display = 'block';
    document.getElementById('writeButtons').style.display = 'flex';
    document.getElementById('voiceButtons').style.display = 'none';
  } else {
    document.getElementById('answerInput').style.display = 'none';
    document.getElementById('writeButtons').style.display = 'none';
    document.getElementById('voiceButtons').style.display = 'flex';
  }

  document.getElementById('result').style.display = 'none';
  document.getElementById('voiceResult').style.display = 'none';
  document.getElementById('audioPlayback').style.display = 'none';
  document.getElementById('processingMsg').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('nextBtnVoice').style.display = 'none';
}

function startListening() {
  if (!recognition) {
    alert('A böngésződ nem támogatja a hangfelismerést. Próbáld Chrome-ban!');
    return;
  }
  if (isListening) {
    recognition.stop();
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        recordedAudioURL = URL.createObjectURL(audioBlob);
        document.getElementById('audioPlayer').src = recordedAudioURL;
        document.getElementById('audioPlayback').style.display = 'block';
        stream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start();

      isListening = true;
      document.getElementById('voiceBtn').classList.add('listening');
      document.getElementById('voiceText').textContent = 'Hallgatlak...';
      document.getElementById('micIcon').textContent = '🔴';
      document.getElementById('voiceResult').style.display = 'none';
      document.getElementById('audioPlayback').style.display = 'none';

      recognition.start();
    })
    .catch(() => alert('Nem sikerült hozzáférni a mikrofonhoz. Engedélyezd a mikrofont!'));
}

function stopListening() {
  isListening = false;
  document.getElementById('voiceBtn').classList.remove('listening');
  document.getElementById('voiceText').textContent = 'Nyomd meg és beszélj';
  document.getElementById('micIcon').textContent = '🎤';
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}

function normalize(str) {
  return (str || "")
    .toLowerCase()
    .replace(/\u00A0/g, " ")
    .replace(/[’]/g, "'")
    .replace(/\bi'm\b/g, "i am")
    .replace(/\byou're\b/g, "you are")
    .replace(/\bhe's\b/g, "he is")
    .replace(/\bshe's\b/g, "she is")
    .replace(/\bit's\b/g, "it is")
    .replace(/\bwe're\b/g, "we are")
    .replace(/\bthey're\b/g, "they are")
    .replace(/\bi've\b/g, "i have")
    .replace(/\byou've\b/g, "you have")
    .replace(/\bwe've\b/g, "we have")
    .replace(/\bthey've\b/g, "they have")
    .replace(/\bcan't\b/g, "cannot")
    .replace(/\bwon't\b/g, "will not")
    .replace(/\bdon't\b/g, "do not")
    .replace(/\bdoesn't\b/g, "does not")
    .replace(/\bdidn't\b/g, "did not")
    .replace(/\bisn't\b/g, "is not")
    .replace(/\baren't\b/g, "are not")
    .replace(/\bwasn't\b/g, "was not")
    .replace(/\bweren't\b/g, "were not")
    .replace(/\s+([.,!?;:])/g, "$1")
    .replace(/[.,!?;:]/g, "")
    .replace(/'/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function getStageInfo(index) {
  if (index < phraseCount) {
    return {
      label: "Bemelegítés: kifejezések",
      sub: "Írd/mondd az angol kifejezést a magyar jelentés alapján.",
      localIndex: index + 1,
      localTotal: phraseCount
    };
  }
  const sIndex = index - phraseCount;
  return {
    label: "Mondatok",
    sub: "Írd/mondd a teljes angol mondatot.",
    localIndex: sIndex + 1,
    localTotal: sentenceCount
  };
}

function loadCard() {
  const item = items[currentIndex];
  const stage = getStageInfo(currentIndex);

  document.getElementById('stageLabel').textContent = stage.label;
  document.getElementById('subHint').textContent = stage.sub;
  document.getElementById('hungarianText').textContent = item.hungarian;

  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').focus();
  document.getElementById('result').style.display = 'none';
  document.getElementById('voiceResult').style.display = 'none';
  document.getElementById('audioPlayback').style.display = 'none';
  document.getElementById('processingMsg').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('nextBtnVoice').style.display = 'none';

  document.getElementById('current').textContent = stage.localIndex;
  document.getElementById('total').textContent = stage.localTotal;

  const progress = (currentIndex / items.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';

  if (recordedAudioURL) {
    URL.revokeObjectURL(recordedAudioURL);
    recordedAudioURL = null;
  }
}

function renderIncorrect(acceptableAnswers) {
  let html = '<strong>✗ Nem egészen...</strong>' +
    '<div class="correct-answer"><strong>A helyes megoldás:</strong><br>' +
    acceptableAnswers[0] + '</div>';

  if (acceptableAnswers.length > 1) {
    html = html.replace('</div>', '<div style="margin-top:10px"><strong>Más elfogadott válaszok:</strong><br>' +
      acceptableAnswers.slice(1).join('<br>') + '</div></div>');
  }
  return html;
}

function checkGeneric(userText) {
  const correctAnswer = items[currentIndex].english;
  const acceptableAnswers = Array.isArray(correctAnswer) ? correctAnswer : [correctAnswer];
  const userNorm = normalize(userText);
  const correctNorms = acceptableAnswers.map(a => normalize(a));
  return { ok: correctNorms.includes(userNorm), acceptableAnswers };
}

function checkVoiceAnswer(transcript) {
  const resultDiv = document.getElementById('result');
  const verdict = checkGeneric(transcript);

  resultDiv.style.display = 'block';
  document.getElementById('nextBtnVoice').style.display = 'block';

  if (verdict.ok) {
    correctCount++;
    resultDiv.className = 'result correct';
    resultDiv.innerHTML = '<strong>✓ Helyes!</strong><div class="correct-answer">Remek! 🎉</div>';
  } else {
    resultDiv.className = 'result incorrect';
    resultDiv.innerHTML = renderIncorrect(verdict.acceptableAnswers);
  }
}

function checkAnswer() {
  const userAnswer = document.getElementById('answerInput').value;
  const resultDiv = document.getElementById('result');
  const verdict = checkGeneric(userAnswer);

  resultDiv.style.display = 'block';
  document.getElementById('nextBtn').style.display = 'block';

  if (verdict.ok) {
    correctCount++;
    resultDiv.className = 'result correct';
    resultDiv.innerHTML = '<strong>✓ Helyes!</strong><div class="correct-answer">Kitűnő! 🎉</div>';
  } else {
    resultDiv.className = 'result incorrect';
    resultDiv.innerHTML = renderIncorrect(verdict.acceptableAnswers);
  }
}

function nextCard() {
  currentIndex++;
  if (currentIndex < items.length) {
    loadCard();
  } else {
    showCompletion();
  }
}

function showCompletion() {
  document.getElementById('cardContainer').style.display = 'none';
  document.getElementById('completion').style.display = 'block';
  document.getElementById('stageLabel').textContent = "Kész!";
  document.getElementById('progressFill').style.width = '100%';
  const percentage = Math.round((correctCount / items.length) * 100);
  document.getElementById('finalScore').textContent = percentage + '%';
}

function restart() {
  currentIndex = 0;
  correctCount = 0;
  document.getElementById('cardContainer').style.display = 'block';
  document.getElementById('completion').style.display = 'none';
  loadCard();
}

document.getElementById('answerInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    if (document.getElementById('nextBtn').style.display === 'none') checkAnswer();
    else nextCard();
  }
});

loadCard();
</script>
</body>
</html>
