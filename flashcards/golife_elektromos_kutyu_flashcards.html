<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoLife – Elektromos kütyü (Flashcards)</title>
<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    min-height:100vh;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.back{
    position:fixed;
    top:20px;
    left:20px;
    background:#fff;
    color:#667eea;
    padding:10px 16px;
    border-radius:10px;
    font-weight:bold;
    text-decoration:none;
    box-shadow:0 6px 15px rgba(0,0,0,.2);
}
.container{
    background:#fff;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    max-width:700px;
    width:100%;
    padding:30px;
}
h1{
    text-align:center;
    color:#667eea;
    margin-bottom:25px;
}
.card{
    background:#f8f9fa;
    border-radius:14px;
    padding:25px;
}
.hungarian{
    font-size:20px;
    margin-bottom:15px;
}
input{
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
}
button{
    margin-top:12px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.check{background:#667eea;color:#fff;}
.next{background:#2ecc71;color:#fff;display:none;}
.result{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
}
.correct{background:#d4edda;}
.incorrect{background:#f8d7da;}
.meta{text-align:center;margin-top:15px;color:#666;}
</style>
</head>
<body>

<a href="../index.html" class="back">⬅ Vissza a főmenübe</a>

<div class="container">
<h1>📦 GoLife – elektromos kütyü</h1>

<div class="card">
<div class="hungarian" id="hu"></div>
<input type="text" id="input" placeholder="Írd be az angol mondatot">
<button class="check" onclick="check()">Ellenőrzés</button>
<button class="next" id="nextBtn" onclick="next()">Következő</button>
<div class="result" id="result"></div>
</div>

<div class="meta">Mondat <span id="i">1</span> / <span id="t"></span></div>
</div>

<script>
const sentences = [
 {hu:"Van valamilyen márkapreferenciád?", en:"Do you have any brand preferences?"},
 {hu:"Mennyi garancia van rá?", en:"How long warranty does it carry?"},
 {hu:"6 hónap garanciát biztosítunk.", en:"We are offering a warranty of 6 months."},
 {hu:"El tudná mondani, hogyan működik?", en:"Could you tell me how it works?"},
 {hu:"Természetesen. Először nyomja meg ezt a gombot.", en:"Certainly. First, press this button."},
 {hu:"Az elemek benne vannak?", en:"Are the batteries included?"},
 {hu:"Igen, benne vannak.", en:"Yes, they are."},
 {hu:"Szeretnék venni egy új kamerát.", en:"I would like to buy a new camera."},
 {hu:"Mennyi a garancia ideje?", en:"How long is the warranty?"},
 {hu:"A használati útmutató benne van a dobozban?", en:"Is the manual in the box?"}
];

let idx=0;

function n(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();}

function load(){
 hu.textContent=sentences[idx].hu;
 input.value='';
 result.style.display='none';
 nextBtn.style.display='none';
 i.textContent=idx+1;
 t.textContent=sentences.length;
}

function check(){
 const u=n(input.value);
 const c=n(sentences[idx].en);
 result.style.display='block';
 if(u===c){
  result.className='result correct';
  result.textContent='✓ Helyes!';
 }else{
  result.className='result incorrect';
  result.innerHTML='✗ Helytelen.<br><strong>Helyes:</strong> '+sentences[idx].en;
 }
 nextBtn.style.display='block';
}

function next(){
 idx++;
 if(idx<sentences.length){load();}
 else{alert('Kész! 🎉');}
}

load();
</script>
</body>
</html>
