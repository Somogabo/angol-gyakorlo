<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrasal Verbs Gyakorló</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ⬅ VISSZA A FŐMENÜBE */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            background: #ffffff;
            color: #667eea;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .back-button:hover {
            background: #f0f0f0;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }

        .hungarian {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .check-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .next-btn {
            background: #28a745;
            color: white;
            display: none;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .correct {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #666;
        }

        .completion {
            text-align: center;
            display: none;
        }

        .completion h2 {
            color: #28a745;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .restart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 40px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<a href="../index.html" class="back-button">⬅ Vissza a főmenübe</a>

<div class="container">
    <h1>🎯 Phrasal Verbs Alapfok - 17. Fejezet</h1>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="cardContainer">
        <div class="card">
            <div class="hungarian" id="hungarianText"></div>
            <input type="text" id="answerInput" placeholder="Írd be az angol kifejezést..." autocomplete="off">
            <div class="buttons">
                <button class="check-btn" onclick="checkAnswer()">Ellenőrzés</button>
                <button class="next-btn" id="nextBtn" onclick="nextCard()">Következő →</button>
            </div>
            <div class="result" id="result"></div>
        </div>
        <div class="stats">Kifejezés <span id="current">1</span> / <span id="total">12</span></div>
    </div>

    <div class="completion" id="completion">
        <h2>🎉 Gratulálok!</h2>
        <div class="score" id="finalScore"></div>
        <button class="restart-btn" onclick="restart()">Újrakezdés</button>
    </div>
</div>

<script>
const sentences = [
    { hungarian: "Leállítani, kikapcsolni", english: "shut down" },
    { hungarian: "Kikeresni valamit", english: "look up" },
    { hungarian: "Bejelentkezni", english: "log on" },
    { hungarian: "Kijelentkezni", english: "log out" },
    { hungarian: "Kiadni", english: "rent out" },
    { hungarian: "Várni valamire", english: "look forward to" }
];

let currentIndex = 0;
let correctCount = 0;

function loadCard() {
    document.getElementById("hungarianText").textContent = sentences[currentIndex].hungarian;
    document.getElementById("answerInput").value = "";
    document.getElementById("result").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("current").textContent = currentIndex + 1;
    document.getElementById("total").textContent = sentences.length;
    document.getElementById("progressFill").style.width =
        (currentIndex / sentences.length) * 100 + "%";
}

function checkAnswer() {
    const user = document.getElementById("answerInput").value.trim().toLowerCase();
    const correct = sentences[currentIndex].english.toLowerCase();
    const result = document.getElementById("result");
    result.style.display = "block";
    document.getElementById("nextBtn").style.display = "block";

    if (user === correct) {
        correctCount++;
        result.className = "result correct";
        result.textContent = "✓ Helyes!";
    } else {
        result.className = "result incorrect";
        result.textContent = "✗ Helytelen. Helyes: " + sentences[currentIndex].english;
    }
}

function nextCard() {
    currentIndex++;
    if (currentIndex < sentences.length) {
        loadCard();
    } else {
        document.getElementById("cardContainer").style.display = "none";
        document.getElementById("completion").style.display = "block";
        document.getElementById("finalScore").textContent =
            Math.round((correctCount / sentences.length) * 100) + "%";
    }
}

function restart() {
    currentIndex = 0;
    correctCount = 0;
    document.getElementById("completion").style.display = "none";
    document.getElementById("cardContainer").style.display = "block";
    loadCard();
}

loadCard();
</script>

</body>
</html>
