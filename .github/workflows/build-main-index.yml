name: Build main index.html (GOANGOL)

on:
  push:
    branches: [ "main" ]
    paths:
      - "auto-index.html"
      - "flashcards/**"
      - ".github/workflows/build-main-index.yml"

jobs:
  build-main-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy auto-index to main index
        run: |
          cp auto-index.html index.html

      - name: Commit index.html
        uses: EndBug/add-and-commit@v9
        with:
          add: "index.html"
          message: "Auto-generate main index.html from auto-index.html [skip ci]"
          default_author: github_actions
