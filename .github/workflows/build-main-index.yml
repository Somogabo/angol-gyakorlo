name: Build main index.html (GOANGOL)

on:
  push:
    branches: [ "main" ]
    paths:
      - "auto-index.html"
      - ".github/workflows/build-main-index.yml"

permissions:
  contents: read

jobs:
  build-main-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy auto-index.html to index.html (no commit)
        run: |
          cp auto-index.html index.html

      - name: Show result (debug)
        run: |
          echo "index.html first lines:"
          head -n 20 index.html
