name: Build main index.html (GOANGOL)

on:
  push:
    branches: [ main ]

# Ne fusson egyszerre több generálás (különben összeakad a push)
concurrency:
  group: goangol-build-main-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-main-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate index.html + auto-index.html (classic style, clickable links)
        shell: bash
        run: |
          set -euo pipefail

          FLASHDIR="flashcards"
          mkdir -p "$FLASHDIR"

          # ---- helpers ----
         file_title () {
            # input: filename without path, with .html
            local f="$1"
            local b="${f%.html}"

            case "$b" in
              phrasal_verbs_alapfok_*_flashcards)
                # pl: phrasal_verbs_alapfok_15_flashcards -> Alapfok 15
                echo "$b" | sed -E 's/^phrasal_verbs_alapfok_([0-9]+)_flashcards$/Alapfok \1/'
                ;;
              phrasal_verbs_flashcards)
                echo "Alapfok (Phrasal Verbs)"
                ;;
              expressions_alapfok_*_flashcards)
                echo "$b" | sed -E 's/^expressions_alapfok_([0-9]+)_flashcards$/Expressions – Alapfok \1/'
                ;;
              expressions_*_flashcards)
                # pl: expressions_19_flashcards -> Expressions – 19
                echo "$b" | sed -E 's/^expressions_([0-9]+)_flashcards$/Expressions – \1/'
                ;;
              kifejezesek_alapfok_*_flashcards)
                echo "$b" | sed -E 's/^kifejezesek_alapfok_([0-9]+)_flashcards$/Kifejezések – Alapfok \1/'
                ;;
              present_perfect_flashcards)
                echo "Present Perfect"
                ;;
              megszamlalhato_megszamlalhatatlan_alapfok)
                echo "Megszámlálható / megszámlálhatatlan"
                ;;
              golife_elektromos_kutyu_flashcards)
                echo "GoLife – elektromos kütyü"
                ;;
              *)
                # általános fallback: underscore -> space, felesleges "flashcards" levágása
                echo "$b" | sed -E 's/_/ /g; s/\bflashcards\b//g; s/[[:space:]]+/ /g; s/^ //; s/ $//'
                ;;
            esac
          }

         # Gyűjtés (csak a flashcards mappából)
          mapfile -t FILES < <(find "$FLASHDIR" -maxdepth 1 -type f -name "*.html" \
            ! -name "auto-index.html" ! -name "index.html" | sed "s|^$FLASHDIR/||" | sort)

          # kategóriák listái (HTML <li> sorok)
          PV=""
          EX=""
          NY=""
          SZ=""

          for f in "${FILES[@]}"; do
            t="$(file_title "$f")"
            href="$FLASHDIR/$f"

            li="<li><a href=\"$href\">$t<span class=\"sub\">Flashcards</span></a></li>"

            case "$f" in
              phrasal_verbs*)
                PV+="$li"$'\n'
                ;;
              expressions*|kifejezesek*)
                EX+="$li"$'\n'
                ;;
              present_perfect*|megszamlalhato*)
                NY+="$li"$'\n'
                ;;
              golife*)
                SZ+="$li"$'\n'
                ;;
              *)
                # ha később lesz “egyéb”, tehetjük ide is, de most a Szituációkba dobjuk
                SZ+="$li"$'\n'
                ;;
            esac
          done

          # ---- MAIN index.html (régi, “klasszikus” stílus) ----
          cat > index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="hu">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>GOANGOL – Főmenü</title>
            <style>
              *{box-sizing:border-box}
              body{
                margin:0;
                font-family: Arial, sans-serif;
                min-height:100vh;
                background: linear-gradient(135deg,#667eea,#764ba2);
                padding: 28px 18px;
                color:#1f2a44;
                display:flex;
                justify-content:center;
              }
              .wrap{width:min(980px,100%)}
              .header{
                text-align:center;
                color:#fff;
                margin-bottom: 18px;
              }
              .header h1{
                margin:0 0 8px;
                font-size: clamp(26px, 3.2vw, 38px);
                letter-spacing:.2px;
              }
              .header p{
                margin:0;
                opacity:.92;
                font-weight: 700;
              }
              .topbar{
                display:flex;
                justify-content:center;
                gap:10px;
                margin: 14px 0 18px;
                flex-wrap:wrap;
              }
              .btn{
                display:inline-flex;
                align-items:center;
                gap:8px;
                padding:10px 14px;
                border-radius: 12px;
                background: rgba(255,255,255,.92);
                color:#203055;
                text-decoration:none;
                font-weight: 900;
                box-shadow: 0 10px 25px rgba(0,0,0,.18);
                border: 1px solid rgba(255,255,255,.45);
              }
              .btn:hover{transform: translateY(-1px)}
              .grid{
                display:grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 14px;
                margin-top: 8px;
              }
              .card{
                background: rgba(255,255,255,.98);
                border-radius: 16px;
                box-shadow: 0 18px 45px rgba(0,0,0,.22);
                padding: 16px 16px 10px;
                border: 1px solid rgba(255,255,255,.35);
              }
              .card h2{
                margin: 2px 0 10px;
                font-size: 18px;
                color:#355cff;
                display:flex;
                align-items:center;
                gap:8px;
              }
              ul{list-style:none; padding:0; margin:0}
              li{margin: 10px 0}
              a.lesson{
                display:block;
                text-decoration:none;
                color:#1f2a44;
                font-weight: 800;
                padding: 10px 12px;
                border-radius: 12px;
                border: 1px solid rgba(31,42,68,.12);
                background: rgba(79,107,255,.06);
                transition: transform .08s ease, background .15s ease;
              }
              a.lesson:hover{
                transform: translateY(-1px);
                background: rgba(79,107,255,.12);
              }
              .sub{
                display:block;
                margin-top: 4px;
                font-size: 12px;
                font-weight: 800;
                color: rgba(31,42,68,.65);
              }
              .footer{
                text-align:center;
                color: rgba(255,255,255,.9);
                font-weight: 700;
                margin-top: 16px;
                font-size: 12px;
              }
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="header">
                <h1>📚 GOANGOL – Főmenü</h1>
                <p>Válassz leckét (Flashcards)</p>
              </div>

              <div class="topbar">
                <a class="btn" href="auto-index.html">📋 Automatikus lecke lista</a>
              </div>

              <div class="grid">
                <section class="card">
                  <h2>⚡ Phrasal Verbs</h2>
                  <ul>
          HTML

          # Beillesztjük a kategóriákat, és a linkek kapják a "lesson" class-t
          # (a klasszikus stílus miatt)
          echo "$PV" | sed 's/<a href="/<a class="lesson" href="/g' >> index.html

          cat >> index.html <<'HTML'
                  </ul>
                </section>

                <section class="card">
                  <h2>🧩 Expressions / Kifejezések</h2>
                  <ul>
          HTML

          echo "$EX" | sed 's/<a href="/<a class="lesson" href="/g' >> index.html

          cat >> index.html <<'HTML'
                  </ul>
                </section>

                <section class="card">
                  <h2>📘 Nyelvtan</h2>
                  <ul>
          HTML

          echo "$NY" | sed 's/<a href="/<a class="lesson" href="/g' >> index.html

          cat >> index.html <<'HTML'
                  </ul>
                </section>

                <section class="card">
                  <h2>🛒 Szituációk</h2>
                  <ul>
          HTML

          echo "$SZ" | sed 's/<a href="/<a class="lesson" href="/g' >> index.html

          cat >> index.html <<'HTML'
                  </ul>
                </section>
              </div>

              <div class="footer">
                Tipp: ha új leckét teszel a flashcards mappába és commitolsz, a főmenü automatikusan frissül.
              </div>
            </div>
          </body>
          </html>
          HTML

          # ---- auto-index.html (egyszerű lista) ----
          cat > auto-index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="hu">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>GOANGOL – Automatikus lecke lista</title>
            <style>
              body{
                margin:0;
                font-family: Arial, sans-serif;
                background: linear-gradient(135deg,#667eea,#764ba2);
                color:#111;
              }
              .wrap{
                max-width: 980px;
                margin: 0 auto;
                padding: 28px 18px 40px;
              }
              .title{
                display:flex;
                align-items:center;
                justify-content:center;
                gap:12px;
                color:#fff;
                font-weight: 900;
                font-size: 34px;
                margin: 10px 0 6px;
              }
              .subtitle{
                text-align:center;
                color: rgba(255,255,255,0.9);
                margin: 0 0 20px;
                font-weight: 800;
              }
              .bar{
                display:flex;
                justify-content:center;
                gap: 10px;
                margin: 14px 0 22px;
                flex-wrap: wrap;
              }
              .btn{
                background: rgba(255,255,255,0.9);
                border: 0;
                border-radius: 12px;
                padding: 10px 14px;
                cursor: pointer;
                text-decoration: none;
                color:#222;
                font-weight: 800;
                box-shadow: 0 8px 20px rgba(0,0,0,0.15);
              }
              .card{
                background: rgba(255,255,255,0.92);
                border-radius: 18px;
                padding: 18px;
                box-shadow: 0 18px 45px rgba(0,0,0,.22);
                border: 1px solid rgba(255,255,255,.35);
              }
              .card h2{
                margin: 0 0 12px;
                color:#203055;
                font-size: 18px;
              }
              .row{
                display:block;
                padding: 12px 12px;
                border-radius: 12px;
                background: rgba(0,0,0,0.05);
                margin: 10px 0;
                text-decoration:none;
                color:#111;
                font-weight: 900;
              }
              .row:hover{background: rgba(0,0,0,0.08)}
              .foot{
                text-align:center;
                color: rgba(255,255,255,0.9);
                margin-top: 14px;
                font-weight: 800;
                font-size: 12px;
              }
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="title">📚 GOANGOL – Automatikus lecke lista</div>
              <div class="subtitle">Ezt az oldalt a GitHub Actions generálja a repo-ban lévő flashcard HTML-ekből.</div>

              <div class="bar">
                <a class="btn" href="index.html">⬅️ Vissza a főmenübe</a>
                <a class="btn" href="auto-index.html">🔄 Frissítés (újratöltés)</a>
              </div>

              <div class="card">
                <h2>⚡ Összes lecke</h2>
          HTML

          for f in "${FILES[@]}"; do
            t="$(file_title "$f")"
            echo "<a class=\"row\" href=\"$FLASHDIR/$f\">$t</a>" >> auto-index.html
          done

          cat >> auto-index.html <<'HTML'
              </div>

              <div class="foot">Tipp: ha új leckét teszel fel, elég commitolni — az oldal automatikusan frissül.</div>
            </div>
          </body>
          </html>
          HTML

      - name: Commit and push generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html auto-index.html

          # Ha nincs változás, ne commitoljunk
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-generate index.html + auto-index.html [skip ci]"

          # Rebase + push (hogy ne legyen non-fast-forward)
          git pull --rebase origin main
          git push
