name: Build main index.html (GOANGOL)

on:
  push:
    branches:
      - main

jobs:
  build-main-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate index.html automatically
        shell: bash
        run: |
          set -e

          FILES=$(ls flashcards/*.html 2>/dev/null || true)

          echo '<!DOCTYPE html>' > index.html
          echo '<html lang="hu">' >> index.html
          echo '<head>' >> index.html
          echo '  <meta charset="UTF-8" />' >> index.html
          echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0" />' >> index.html
          echo '  <title>GOANGOL – Főmenü</title>' >> index.html

          echo '  <style>' >> index.html
          echo '  *{box-sizing:border-box}' >> index.html
          echo '  body{' >> index.html
          echo '    margin:0;' >> index.html
          echo '    font-family:Arial, sans-serif;' >> index.html
          echo '    min-height:100vh;' >> index.html
          echo '    background:linear-gradient(135deg,#667eea,#764ba2);' >> index.html
          echo '    padding:28px 18px;' >> index.html
          echo '    color:#1f2a44;' >> index.html
          echo '    display:flex;' >> index.html
          echo '    justify-content:center;' >> index.html
          echo '  }' >> index.html

          echo '  .wrap{width:min(980px,100%)}' >> index.html
          echo '  header{text-align:center;color:#fff;margin-bottom:18px}' >> index.html
          echo '  header h1{margin:0 0 6px;font-size:clamp(26px,3.2vw,38px)}' >> index.html
          echo '  header p{margin:0;opacity:.9;font-weight:600}' >> index.html

          echo '  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}' >> index.html
          echo '  .card{background:rgba(255,255,255,.97);border-radius:16px;padding:14px;box-shadow:0 18px 45px rgba(0,0,0,.22)}' >> index.html
          echo '  .card h2{margin:4px 6px 10px;font-size:18px;color:#355cff}' >> index.html

          echo '  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}' >> index.html

          echo '  .lesson{' >> index.html
          echo '    display:flex;' >> index.html
          echo '    justify-content:space-between;' >> index.html
          echo '    align-items:center;' >> index.html
          echo '    width:100%;' >> index.html
          echo '    padding:12px 14px;' >> index.html
          echo '    border-radius:12px;' >> index.html
          echo '    background:#f3f6ff;' >> index.html
          echo '    text-decoration:none;' >> index.html
          echo '    color:inherit;' >> index.html
          echo '    transition:.15s;' >> index.html
          echo '  }' >> index.html

          echo '  .lesson:hover{background:#e9eeff;transform:translateY(-1px)}' >> index.html
          echo '  .tag{font-size:12px;padding:3px 8px;border-radius:999px;background:#dbe4ff;color:#1f3cff;font-weight:700}' >> index.html

          echo '  .hint{text-align:center;color:#fff;opacity:.85;margin-top:18px;font-size:13px}' >> index.html
          echo '  </style>' >> index.html
          echo '</head>' >> index.html
          echo '<body>' >> index.html

          echo '<div class="wrap">' >> index.html
          echo '<header>' >> index.html
          echo '<h1>📚 GOANGOL – Főmenü</h1>' >> index.html
          echo '<p>Válassz leckét (Flashcards)</p>' >> index.html
          echo '</header>' >> index.html

          echo '<div class="grid">' >> index.html

          declare -a phrasal expressions grammar situations

          for f in $FILES; do
            name=$(basename "$f")
            lname=$(echo "$name" | tr '[:upper:]' '[:lower:]')
            if [[ $lname == *phrasal* ]]; then phrasal+=("$name")
            elif [[ $lname == *express* || $lname == *kifejezes* ]]; then expressions+=("$name")
            elif [[ $lname == *perfect* || $lname == *megszamlal* ]]; then grammar+=("$name")
            else situations+=("$name")
            fi
          done

          pretty_title () {
            echo "$1" | sed -E 's/\.html$//;s/_/ /g;s/ +/ /g;s/\b\w/\U&/g'
          }

          render_card () {
            local title="$1"
            shift
            local arr=("$@")
            [ "${#arr[@]}" -eq 0 ] && return 0

            echo '<div class="card">' >> index.html
            echo "<h2>$title</h2>" >> index.html
            echo '<ul>' >> index.html
            for f in "${arr[@]}"; do
              t=$(pretty_title "$f")
              echo "<li><a class=\"lesson\" href=\"flashcards/$f\"><span>$t</span><span class=\"tag\">Flashcards</span></a></li>" >> index.html
            done
            echo '</ul></div>' >> index.html
          }

          render_card "⚡ Phrasal Verbs" "${phrasal[@]}"
          render_card "🧩 Expressions / Kifejezések" "${expressions[@]}"
          render_card "📘 Nyelvtan" "${grammar[@]}"
          render_card "🛒 Szituációk" "${situations[@]}"

          echo '</div>' >> index.html
          echo '<div class="hint">Tipp: ha új leckét teszel fel a flashcards mappába és commitolsz, a főmenü automatikusan frissül.</div>' >> index.html
          echo '</div>' >> index.html
          echo '</body></html>' >> index.html

      - name: Commit and push index.html
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- index.html; then
            echo "No changes in index.html"
            exit 0
          fi

          git add index.html
          git commit -m "Auto-generate main index.html (clickable cards) [skip ci]"
          git push
