name: Build main index.html (GOANGOL)

on:
  push:
    branches:
      - main

jobs:
  build-main-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate main index.html with colored category cards
        shell: bash
        run: |
          set -e

          FLASHDIR="flashcards"

          # Biztonság: ha nincs flashcards mappa, akkor is építsünk egy alap indexet
          if [ ! -d "$FLASHDIR" ]; then
            mkdir -p "$FLASHDIR"
          fi

          # HTML eleje
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="hu">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>GOANGOL – Főmenü</title>
            <style>
              *{box-sizing:border-box}
              body{
                margin:0;
                font-family: Arial, sans-serif;
                min-height:100vh;
                background: linear-gradient(135deg,#667eea,#764ba2);
                padding: 28px 18px;
                color:#1f2a44;
                display:flex;
                justify-content:center;
              }
              .wrap{width:min(980px,100%)}
              .header{
                text-align:center;
                color:#fff;
                margin-bottom:18px;
              }
              .header h1{
                margin:0 0 8px;
                font-size: clamp(26px, 3.2vw, 38px);
                letter-spacing:.2px;
              }
              .header p{
                margin:0;
                opacity:.92;
                font-weight:700;
              }

              .topbar{
                display:flex;
                justify-content:center;
                gap:10px;
                margin: 14px 0 18px;
                flex-wrap:wrap;
              }
              .btn{
                display:inline-flex;
                align-items:center;
                gap:8px;
                padding:10px 14px;
                border-radius: 12px;
                background: rgba(255,255,255,.92);
                color:#203055;
                text-decoration:none;
                font-weight:800;
                border:1px solid rgba(255,255,255,.35);
                box-shadow: 0 10px 28px rgba(0,0,0,.18);
                transition: transform .12s ease, background .12s ease;
              }
              .btn:hover{transform: translateY(-1px); background:#fff}
              .btn:active{transform: translateY(0px)}

              .grid{
                display:grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 14px;
                margin-top: 18px;
              }

              /* KÁRTYA */
              .card{
                background: rgba(255,255,255,.98);
                border-radius: 16px;
                box-shadow: 0 18px 45px rgba(0,0,0,.22);
                padding: 14px 14px 10px;
                border: 1px solid rgba(255,255,255,.35);
                position:relative;
              }
              .card-header{
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:10px;
                margin-bottom: 8px;
              }
              .card-title{
                display:flex;
                align-items:center;
                gap:10px;
                margin: 2px 0;
                font-size: 18px;
                font-weight: 900;
              }
              .icon{
                width:34px;
                height:34px;
                border-radius: 12px;
                display:grid;
                place-items:center;
                color:#fff;
                font-size: 18px;
                font-weight: 900;
                box-shadow: 0 10px 24px rgba(0,0,0,.18);
              }

              /* Kategória-színek (ikon + felső csík + cím szín) */
              .pv{ --accent:#ff8a00; --accent2:#ff4d4d; }
              .exp{ --accent:#2dd4bf; --accent2:#3b82f6; }
              .gram{ --accent:#60a5fa; --accent2:#8b5cf6; }
              .sit{ --accent:#f472b6; --accent2:#fb7185; }

              .card.pv, .card.exp, .card.gram, .card.sit{
                border-top: 6px solid var(--accent);
              }
              .card.pv .card-title,
              .card.exp .card-title,
              .card.gram .card-title,
              .card.sit .card-title{
                color:#22325a;
              }
              .card.pv .icon,
              .card.exp .icon,
              .card.gram .icon,
              .card.sit .icon{
                background: linear-gradient(135deg, var(--accent), var(--accent2));
              }

              /* LECKE SOROK – a teljes sor kattintható */
              .list{
                list-style:none;
                padding:0;
                margin: 10px 0 0;
                display:flex;
                flex-direction:column;
                gap:10px;
              }
              .lesson{
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap: 10px;
                padding: 12px 12px;
                border-radius: 12px;
                background: #f4f6ff;
                border: 1px solid rgba(32,48,85,.12);
                text-decoration:none;
                color:#1f2a44;
                font-weight: 800;
                transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
              }
              .lesson:hover{
                transform: translateY(-1px);
                box-shadow: 0 10px 24px rgba(0,0,0,.12);
                background:#eef2ff;
              }
              .tag{
                font-size: 12px;
                padding: 6px 10px;
                border-radius: 999px;
                background: rgba(0,0,0,.06);
                color:#334155;
                font-weight: 900;
                white-space:nowrap;
              }

              .hint{
                margin-top: 18px;
                text-align:center;
                color: rgba(255,255,255,.82);
                font-size: 12px;
                font-weight: 800;
              }
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="header">
                <h1>📚 GOANGOL – Főmenü</h1>
                <p>Válassz leckét (Flashcards)</p>
              </div>

              <div class="topbar">
                <a class="btn" href="auto-index.html">📋 Automatikus lecke lista</a>
              </div>

              <div class="grid">
          HTML

          # Fájlok listázása
          mapfile -t FILES < <(find "$FLASHDIR" -maxdepth 1 -type f -name "*.html" -printf "%f\n" | sort)

          # Kategorizálás
          phrasal=()
          expressions=()
          grammar=()
          situations=()
          other=()

          for f in "${FILES[@]}"; do
            lf="$(echo "$f" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lf" == *"phrasal"* ]]; then
              phrasal+=("$f")
            elif [[ "$lf" == *"express"* || "$lf" == *"kifejezes"* || "$lf" == *"kifejezés"* ]]; then
              expressions+=("$f")
            elif [[ "$lf" == *"grammar"* || "$lf" == *"nyelvtan"* || "$lf" == *"present"* || "$lf" == *"megszaml"* ]]; then
              grammar+=("$f")
            elif [[ "$lf" == *"golife"* || "$lf" == *"szitu"* || "$lf" == *"situ"* ]]; then
              situations+=("$f")
            else
              other+=("$f")
            fi
          done

          pretty_title() {
            local name="$1"
            name="${name%.html}"
            name="$(echo "$name" | sed -E 's/[_-]+/ /g')"
            name="$(echo "$name" | sed -E 's/[[:space:]]+/ /g' | sed -E 's/^ //; s/ $//')"
            echo "$name"
          }

          render_card() {
            local kind="$1"   # pv/exp/gram/sit
            local icon="$2"   # emoji
            local title="$3"
            shift 3
            local -a arr=("$@")

            # Üres kategóriát ne írjunk ki
            if [ "${#arr[@]}" -eq 0 ]; then
              return 0
            fi

            {
              echo "  <div class=\"card ${kind}\">"
              echo "    <div class=\"card-header\">"
              echo "      <div class=\"card-title\"><span class=\"icon\">${icon}</span> <span>${title}</span></div>"
              echo "    </div>"
              echo "    <ul class=\"list\">"
              for f in "${arr[@]}"; do
                t="$(pretty_title "$f")"
                echo "      <li><a class=\"lesson\" href=\"flashcards/${f}\"><span>${t}</span><span class=\"tag\">Flashcards</span></a></li>"
              done
              echo "    </ul>"
              echo "  </div>"
            } >> index.html
          }

          render_card "pv"   "⚡" "Phrasal Verbs"              "${phrasal[@]}"
          render_card "exp"  "🧩" "Expressions / Kifejezések"  "${expressions[@]}"
          render_card "gram" "📘" "Nyelvtan"                   "${grammar[@]}"
          render_card "sit"  "🛒" "Szituációk"                 "${situations[@]}"

          # Lezárás
          cat >> index.html <<'HTML'
              </div>

              <div class="hint">
                Tipp: ha új leckét teszel a flashcards mappába és commitolsz, a főmenü automatikusan frissül.
              </div>
            </div>
          </body>
          </html>
          HTML

      - name: Commit and push index.html
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- index.html; then
            echo "No changes in index.html"
            exit 0
          fi

          git add index.html
          git commit -m "Auto-generate main index.html [skip ci]"
          git push
