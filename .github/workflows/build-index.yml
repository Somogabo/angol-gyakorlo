name: Build index.html

on:
  push:
    branches:
      - main

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build index.html automatically
        run: |
          echo '<!DOCTYPE html>' > index.html
          echo '<html lang="hu">' >> index.html
          echo '<head>' >> index.html
          echo '  <meta charset="UTF-8">' >> index.html
          echo '  <title>GOANGOL – Auto index</title>' >> index.html
          echo '</head>' >> index.html
          echo '<body>' >> index.html
          echo '  <h1>GOANGOL – Automatikus index</h1>' >> index.html
          echo '  <p>Ez az index GitHub Actions által generálva.</p>' >> index.html
          echo '</body>' >> index.html
          echo '</html>' >> index.html


