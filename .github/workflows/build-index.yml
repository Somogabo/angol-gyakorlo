name: Build index (auto)

on:
  push:
    branches:
      - main

jobs:
  build-index:
    # Fontos: ne fusson végtelen ciklusban a saját commitja miatt
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate auto-index.html from /flashcards
        shell: bash
        run: |
          set -e

          OUT="auto-index.html"

          echo '<!doctype html>' > "$OUT"
          echo '<html lang="hu"><head><meta charset="utf-8"><title>GOANGOL – Auto index</title></head><body>' >> "$OUT"
          echo '<h1>GOANGOL – Automatikus lecke lista</h1>' >> "$OUT"
          echo '<p>Ez a fájl GitHub Actions által generálva.</p>' >> "$OUT"
          echo '<ul>' >> "$OUT"

          if [ -d "flashcards" ]; then
            for f in flashcards/*.html; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              echo "<li><a href=\"flashcards/$base\">$base</a></li>" >> "$OUT"
            done
          else
            echo '<li>Nincs flashcards mappa.</li>' >> "$OUT"
          fi

          echo '</ul>' >> "$OUT"
          echo '</body></html>' >> "$OUT"

      - name: Commit & push if changed
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add auto-index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update auto-index.html"
          git push



