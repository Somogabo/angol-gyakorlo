name: Build index.html

on:
  push:
    branches: ["main"]

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build index.html from flashcards
        run: |
          echo "<!DOCTYPE html>" > index.html
          echo "<html><head><meta charset='utf-8'><title>GOANGOL – Auto index</title></head>" >> index.html
          echo "<body>" >> index.html
          echo "<h1>GOANGOL – automatikus index</h1>" >> index.html
          echo "<p>Ez az index GitHub Actions által generálva.</p>" >> index.html
          echo "</body></html>" >> index.html

